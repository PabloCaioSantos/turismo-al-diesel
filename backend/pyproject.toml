[project]
name = "backend"
version = "0.0.0"
description = "Portal de Turismo Local — JSON API (FastAPI). BFF do frontend vanilla."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends()` em default de argumento é o padrão idiomático do FastAPI.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# seed.py é DADO: descrições longas de passeio ficam melhor em uma linha só.
"src/utils/seed.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
