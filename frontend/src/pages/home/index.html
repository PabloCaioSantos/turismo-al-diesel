<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto Turismo do Al-Diesel</title>
    <meta
      name="description"
      content="Pontos turísticos e culturais do Ceará: praias, açudes, kitesurf, trilhas, gastronomia regional e história. Monte seu roteiro e reserve seus passeios."
    />
    <link rel="stylesheet" href="../../styles/variables.css" />
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../styles/layout.css" />
    <link rel="stylesheet" href="../../components/header/header.css" />
    <link rel="stylesheet" href="../../components/footer/footer.css" />
    <link rel="stylesheet" href="../../components/card-categoria/card-categoria.css" />
    <link rel="stylesheet" href="../../components/card-passeio/card-passeio.css" />
    <link rel="stylesheet" href="./home.css" />
  </head>
  <body>
    <div id="app-header"></div>
    <main id="main-content">
      <section class="hero" aria-label="Boas-vindas">
        <div class="hero__content">
          <h1 class="hero__title">Pontos turísticos e culturais do Ceará</h1>
          <p class="hero__subtitle">
            Praias, açudes e kitesurf, trilhas, gastronomia e história. Descubra e reserve os
            melhores passeios em um só lugar.
          </p>
          <a href="#categorias" class="btn btn--accent hero__cta">Explorar categorias</a>
        </div>
      </section>
      <div class="container">
        <section class="section" id="categorias" aria-labelledby="titulo-categorias">
          <div class="section__header">
            <div>
              <h2 id="titulo-categorias" class="section__title">Categorias</h2>
              <p class="section__subtitle">Escolha o tipo de experiência que você busca</p>
            </div>
          </div>
          <div id="grid-categorias" class="grid-cards" role="list"></div>
        </section>
        <section
          class="section section--alt home-populares"
          id="populares"
          aria-labelledby="titulo-populares"
        >
          <div class="section__header">
            <div>
              <h2 id="titulo-populares" class="section__title">Mais Procurados</h2>
              <p class="section__subtitle">Os passeios que todo mundo está adorando</p>
            </div>
          </div>
          <div id="grid-populares" class="grid-cards" role="list"></div>
        </section>
      </div>
    </main>
    <div id="app-footer"></div>
    <script type="module" src="./home.js"></script>
  </body>
</html>
